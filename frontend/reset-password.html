<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reset Password — Touch of Hope CBO</title>
  <link rel="icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css"/>
  <link rel="stylesheet" href="auth.css"/>
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}</style>
</head>
<body>
<div id="toast"><span id="toast-msg"></span></div>
<div class="auth-box">
  <div class="auth-logo">
    <img src="logo.png" alt="logo" onerror="this.style.display='none'"/>
    <h2>Reset Password</h2>
    <p>Touch of Hope CBO</p>
  </div>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <input class="form-control" id="reset-pass" type="password" placeholder="Min 8 chars, 1 uppercase, 1 number"/>
  </div>
  <div class="form-group">
    <label class="form-label">Confirm New Password</label>
    <input class="form-control" id="reset-confirm" type="password" placeholder="Repeat password"/>
  </div>
  <p id="reset-error" style="color:#dc3545;font-size:12px;margin-bottom:12px;min-height:16px;"></p>
  <button class="btn btn-primary btn-block" onclick="doResetPassword()">Set New Password</button>
  <a href="login.html" class="btn btn-ghost btn-block" style="margin-top:10px;">← Back to Login</a>
</div>
<script src="config.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
  // Validate token exists
  window.addEventListener('load', () => {
    if (!new URLSearchParams(window.location.search).get('token')) {
      document.querySelector('.auth-box').innerHTML = '<p style="text-align:center;color:#dc3545;padding:32px">Invalid or expired reset link.<br/><a href="login.html" style="color:var(--brown)">Go to Login</a></p>';
    }
  });
</script>
</body>
</html>
