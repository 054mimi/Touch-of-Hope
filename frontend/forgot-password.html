<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Forgot Password — Touch of Hope CBO</title>
  <link rel="icon" href="favicon.ico"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css"/>
  <link rel="stylesheet" href="auth.css"/>
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}</style>
</head>
<body>
<div id="toast"><span id="toast-msg"></span></div>
<div class="auth-box">
  <div class="auth-logo">
    <img src="logo.png" alt="logo"/>
    <h2>Forgot Password</h2>
    <p>We'll send you a reset link</p>
  </div>
  <div id="form-forgot">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-control" id="fp-email" type="email" placeholder="your@email.com"
             onkeydown="if(event.key==='Enter') sendReset()"/>
    </div>
    <button class="btn btn-primary btn-block" onclick="sendReset()">Send Reset Link →</button>
    <a href="login.html" class="btn btn-ghost btn-block" style="margin-top:10px;">← Back to Login</a>
  </div>
  <div id="form-sent" class="hide" style="text-align:center;padding:20px 0;">
    <div style="font-size:40px;margin-bottom:12px;">📧</div>
    <h3 style="font-family:'Playfair Display',serif;margin-bottom:8px;">Check your email</h3>
    <p style="color:var(--ink-lt);font-size:13.5px;line-height:1.7;">If that email address is registered, you'll receive a password reset link within a few minutes.</p>
    <a href="login.html" class="btn btn-primary" style="margin-top:20px;">Back to Login</a>
  </div>
</div>
<script src="config.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script>
async function sendReset(){
  const email=document.getElementById('fp-email').value.trim();
  if(!email){toast('Enter your email address',true);return;}
  try{
    await api('POST','/auth/forgot-password',{email},false);
    document.getElementById('form-forgot').classList.add('hide');
    document.getElementById('form-sent').classList.remove('hide');
  }catch(e){toast(e.message,true);}
}
</script>
</body>
</html>
